android.useAndroidX=true

# Build-JVM heap, daemon, and Kotlin-compiler strategy are set globally in
# ~/.gradle/gradle.properties (they're machine-wide, not project-specific).
# Override here only if THIS project needs different memory.

# Kotlin's incremental compiler cache uses relative file paths and crashes
# (IllegalArgumentException: different roots) when the project and the pub
# cache live on different Windows drive letters. Disabling incremental
# compilation avoids the crash; it only costs a slightly slower rebuild.
kotlin.incremental=false

# Enable Gradle Build Cache and parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
