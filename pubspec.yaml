name: esmvafamilyar
description: "EsmVaFamilYar — Persian party word game."
publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Realtime connection to the backend
  socket_io_client: ^2.0.3+1

  # REST calls (auth, leaderboard)
  dio: ^5.7.0

  # OTP code input UI
  pinput: ^5.0.1

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # Micro-interactions / animations
  flutter_animate: ^4.5.0

  # Secure storage for entitlement/purchase data
  flutter_secure_storage: ^9.2.2

  # Non-sensitive local settings (player name, sound on/off)
  shared_preferences: ^2.3.2

  # Icons
  lucide_icons: ^0.257.0

  # Native share sheet (text + image) for the "share result" flow
  share_plus: ^10.1.4
  # Temp-directory path for the rendered share-card image
  path_provider: ^2.1.4

  # .env config (RSA key, Tapsell key — loaded at runtime, not committed)
  flutter_dotenv: ^5.1.0

  # Short sound effects (button clicks, cues)
  audioplayers: ^6.1.0
  # Looping background music — ExoPlayer-backed; audioplayers' ReleaseMode.loop
  # is unreliable on Android for a single looping track.
  just_audio: ^0.10.6
  # Direct dep so we can configure the shared audio session (mix, no focus)
  # — pulled in transitively by just_audio anyway.
  audio_session: ^0.2.4

  # Consistent 3D-press button style used for every tappable action
  animated_button: ^0.3.1

  # Rewarded video ads (gift-box "watch ad for coins" flow). Tapsell's
  # current mediation SDK — its predecessor `tapsell_plus` bundles an
  # ancient native SDK whose show-callbacks never cross back to Dart on a
  # Play-Services-less device, so `onAdRewarded` could never fire.
  tapsell_mediation: ^1.4.0-alpha03
  # The "Legacy" (Tapsell-direct) ad-network adapter for tapsell_mediation.
  # Without it the only registered adapter is the mediation core's own
  # "Tapsell" entry, and a Legacy-type zone (the kind Tapsell's test zones
  # and most Tapsell-direct dashboard zones are) has an empty waterfall →
  # every requestRewardedAd returns HTTP 400 "Failed to request ad: {}".
  tapsell_mediation_legacy: ^1.4.0-alpha03

  # In-app billing for the Shop's coin packs. Which store a build talks to
  # is fixed at build time by the `STORE` dart-define + Gradle product
  # flavor (`bazaar` | `myket`) — see MYKET_IAP.md. Both plugins are always
  # compiled in; only one is initialised at runtime (lib/services/iap/).
  # Android only — every call is guarded so the rest of the app never
  # branches on Platform.isAndroid.
  #
  # Cafe Bazaar (Poolakey). `+1.0.0` is the bundled native Poolakey SDK version.
  flutter_poolakey: 2.2.0+1.0.0
  # Myket. Its Android module compiles with a JDK-21 toolchain (Gradle
  # auto-provisions it) and needs the maven.myket.ir repo — added in
  # android/build.gradle.kts.
  myket_iap: ^1.1.10

  # Firebase. Config comes from android/app/google-services.json (Android)
  # and lib/firebase_options.dart (generated by `flutterfire configure`).
  firebase_core: ^4.14.0
  # Usage analytics. Works without Google Play Services (own transport).
  firebase_analytics: ^12.5.0
  # Push notifications (FCM). NOTE: FCM delivery needs Google Play Services
  # on the device — on Play-Services-less phones (common in the Bazaar
  # market) push won't arrive; the in-app /notifications API is the fallback.
  firebase_messaging: ^16.6.0
  # Shows FCM messages while the app is in the foreground (FCM only
  # auto-displays them when the app is backgrounded).
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates Android launcher icons (legacy + adaptive) from assets/icon/.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation. Source art: assets/icon/app_icon.png
# (a copy of assets/images/logo.png, verbatim). No adaptive icon /
# background / padding — the launcher shows the PNG exactly as-is.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/sound/

  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
